name: CI/CD Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: "Checkout code"
        uses: actions/checkout@v4

      # 2. Cài Java
      - name: "Setup JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: "Grant execute permission"
        run: chmod +x mvnw
        working-directory: HuynhMinhQuan

      # 3. Build project
      - name: "Build Spring Boot"
        run: ./mvnw clean package -DskipTests
        working-directory: HuynhMinhQuan

      # 4. Login Docker Hub bằng Secrets
      - name: "Login Docker Hub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker image
      - name: "Build Docker Image"
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/democi:latest HuynhMinhQuan

      # 6. Push lên Docker Hub
      - name: "Push Docker Image"
        run: docker push ${{ secrets.DOCKER_USERNAME }}/democi:latest

      - name: Triển khai lên DevOps Classroom
        run: |
          REPO="huynhminhquan123/democi"
          CONTAINER_PORT=80
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}?repo=$REPO&tag=latest&slot=6&container_port=$CONTAINER_PORT&strict_container_port=0")
          BODY=$(echo "$RESPONSE" | sed "$d")
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "Webhook HTTP: $CODE"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Deploy thất bại. Xem chi tiết trong nhóm log bên dưới."
            echo "::group::Chi tiết webhook JSON"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            echo "::endgroup::"
            exit 1
          fi
          echo "Deploy thành công."
          echo "::group::Chi tiết webhook JSON"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo "::endgroup::"
