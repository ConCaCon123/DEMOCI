name: CI/CD Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: "Checkout code"
        uses: actions/checkout@v4

      # 2. Cài Java
      - name: "Setup JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: "Grant execute permission"
        run: chmod +x mvnw
        working-directory: HuynhMinhQuan
      # 3. Build project
      - name: "Build Spring Boot"
        run: ./mvnw clean package -DskipTests
        working-directory: HuynhMinhQuan

      # 4. Login Docker Hub bằng Secrets
      - name: "Login Docker Hub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker image
      - name: "Build Docker Image"
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/democi:latest HuynhMinhQuan .

      # 6. Push lên Docker Hub
      - name: "Push Docker Image"
        run: docker push ${{ secrets.DOCKER_USERNAME }}/democi:latest HuynhMinhQuan
